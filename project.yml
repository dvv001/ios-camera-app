name: ProCamera
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  ProCamera:
    type: application
    platform: iOS
    sources:
      - ProCamera
    info:
      path: ProCamera/Info.plist
      properties:
        CFBundleDisplayName: ProCamera
        NSCameraUsageDescription: ProCamera 需要使用相机来拍照和录像。
        NSMicrophoneUsageDescription: ProCamera 需要使用麦克风为录像录音。
        NSPhotoLibraryAddUsageDescription: ProCamera 需要把照片保存到你的相册。
        NSPhotoLibraryUsageDescription: ProCamera 会把照片归档到相册中的 ProCamera 相簿。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.procamera
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
